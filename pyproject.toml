[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dam"
version = "1.4.0"
description = "Data Analysis Middleware: a package for spatial data handling and transformation."
authors = [
    { name = "Luca Trotter", email = "luca.trotter@cimafoundation.org" },
    { name = "Michel Isabellon"},
    { name = "Checco Avanzi"}
]
maintainers = [
    { name = "Luca Trotter", email = "luca.trotter@cimafoundation.org"}
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: ECPL License",
    "Operating System :: OS Independent",
]
# Note: d3tools uses version pinning for compatibility
# For development: uv pip install -e ../d3tools
# For production: Install d3tools from git+https://github.com/c-hydro/d3tools@main first
dependencies = [
    "d3tools>=2.3.0,<3.0.0",
    "numpy~=2.3.5",
    "xarray~=2025.11.0",
    "astropy~=7.2.0",
    "rasterio~=1.4.0",
    "rioxarray~=0.20.0",
    "scikit_learn~=1.6.1",
    "unpackqa~=0.2.1",
    "pandas~=2.3.3",
    "geopandas~=1.1.1",
    "dask~=2025.11.0",
    "setuptools~=68.1.0"
]

[project.urls]
Repository = "https://github.com/c-hydro/dam"